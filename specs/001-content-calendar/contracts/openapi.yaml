openapi: 3.1.0

info:
  title: Victor Tracker — Auth & Health API
  version: 0.2.0
  description: |
    **Content Calendar (`content-items`) was removed 2026-08-22** — route, components, backend
    API, model, and data, the owner's explicit instruction. This file, originally
    "Content Calendar API", now holds only what survived: `/health` and `/auth/*`, both still
    load-bearing — `frontend/lib/proxy-allowlist.ts` and its own contract test
    (`proxy-allowlist.spec.ts`) still read this file for those two paths, and `Error` is still the
    uniform 4xx shape every other contract in this project references (`backend/AGENTS.md`).
    Kept rather than deleted for that reason — see that test's own header comment on why a
    contract file has to exist for every proxied operation.

    Auth is a bearer token. The browser never holds it — the Next.js proxy attaches it server-side
    from an httpOnly cookie (see research.md R-001), which is why this contract shows a plain
    bearer scheme with no cookie handling.

    Session renewal (FR-002a, research.md R-002): any authenticated response MAY carry an
    `X-Access-Token` header when the presented token is past half-life. The proxy rewrites its
    cookie from that header and strips it before the response reaches the browser. Without this
    header the sliding-reissue mechanism has no transport and a creator is logged out on day 30.

    Error bodies are uniformly `{"detail": "<string>"}`. FastAPI's default
    `RequestValidationError` returns `detail` as an array of objects, so the app installs an
    exception handler that flattens it to a string. Without that handler this contract is a lie
    and the generated client renders `[object Object]`.

servers:
  - url: http://localhost:8000
    description: Local docker-compose
  - url: https://creator-hub-1dgs.onrender.com
    description: |
      Production (Render). Corrected at T074 — this read `creatorhub-api.onrender.com` until then,
      a hostname that has never existed. Render appends a random suffix to the service hostname, and
      its edge answers an unknown host with `404 text/plain "Not Found"` — byte-identical, including
      `content-type`, to what the Vercel proxy returns when `API_BASE_URL` is wrong. T071 lost time to
      exactly that ambiguity, so a wrong hostname here is not cosmetic: it is the trap, pre-loaded,
      for whoever next hand-verifies against production.

      The browser never calls this origin directly (R-001) — it is here for hand-verification and for
      reading the API docs at `/docs`.

tags:
  - name: auth

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [auth]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok

  /auth/login:
    post:
      tags: [auth]
      summary: Exchange credentials for an access token
      description: |
        The only public content-bearing endpoint. There is deliberately no register, refresh, or
        password-reset counterpart — see .claude/rules/tech-defaults.md.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 1
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_at]
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    const: bearer
                  expires_at:
                    type: string
                    format: date-time
                    description: |
                      Roughly 30 days out (FR-002a). Reissued with a fresh window on any
                      authenticated request made past the halfway point.
                  preferences:
                    # Amended by iteration 002 (specs/002-pixel-arcade-skin/contracts/openapi.yaml,
                    # "Amended in this iteration: POST /auth/login"). Deliberately OPTIONAL: a client
                    # built against this file before the amendment is still correct, because
                    # `GET /preferences` at app mount reaches the same state one moment later. The
                    # backend sends it on every login regardless, so the proxy can write the
                    # `ch_theme` cookie from the same response that sets the session cookie, with no
                    # extra round trip on a stack whose cold first request was measured at 44.18s
                    # (T072). This is the one edit iteration 002 makes to this file; the two new
                    # operations it adds live in its own contract, not here.
                    $ref: "../../002-pixel-arcade-skin/contracts/openapi.yaml#/components/schemas/Preferences"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/logout:
    post:
      tags: [auth]
      summary: End the session
      description: |
        Stateless tokens cannot be revoked server-side without a denylist, which v0.1 does not have.
        This endpoint exists so the proxy has something to call while it clears the cookie — the
        meaningful effect is cookie removal on the Vercel origin.
      responses:
        "204":
          description: Session ended
        "401":
          $ref: "#/components/responses/Unauthenticated"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    XAccessToken:
      description: |
        Present only when the presented token was past half-life and has been reissued with a fresh
        30-day window (FR-002a, research.md R-002). The proxy rewrites its session cookie from this
        value — including `Max-Age`, without which the cookie is a session cookie that mobile Safari
        discards on tab eviction — and strips the header before the browser sees it.
      required: false
      schema:
        type: string

  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string

  responses:
    Unauthenticated:
      description: |
        No valid token. Carries no content data of any kind (FR-002, SC-006).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InvalidCredentials:
      description: Email or password incorrect. The message does not reveal which.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ValidationError:
      description: Request body failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
